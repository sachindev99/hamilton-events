<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Find something to do in Hamilton</title>
<style>
  :root{
    --bg:#f7f8fc; --surface:#fff; --ink:#0f1630; --mute:#5b6480;
    --line:#e5e8f2; --acc:#4f46e5; --acc2:#7c3aed;
    --shadow:0 1px 2px rgba(15,22,48,.05),0 8px 24px rgba(15,22,48,.07);
    color-scheme: light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --bg:#0b1020; --surface:#141a30; --ink:#eef1ff; --mute:#9aa5c8;
      --line:#252d4d; --acc:#8b86ff; --acc2:#b1a3ff; --shadow:0 1px 2px rgba(0,0,0,.3);
      color-scheme: dark;
    }
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; padding: 0; background-color: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5; padding-top: env(safe-area-inset-top, 0px);
  }
  header { padding: 2rem 1rem; text-align: center; }
  h1 { margin: 0 0 0.5rem 0; font-size: 2rem; }
  .subtitle { color: var(--mute); font-size: 1.1rem; margin: 0; }
  main { max-width: 1100px; margin: 0 auto; padding: 0 1rem 3rem 1rem; }
  #events-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
  
  .event-card {
    display: flex; flex-direction: column; background-color: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
    box-shadow: var(--shadow); text-decoration: none; color: inherit;
    transition: transform 0.2s ease;
  }
  .event-card:hover { transform: translateY(-4px); }
  
  .card-image { width: 100%; height: 180px; object-fit: cover; background: var(--line); }
  .card-content { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
  
  .event-title { margin: 0 0 0.5rem 0; font-size: 1.25rem; line-height: 1.3; }
  .event-date { font-weight: 600; color: var(--acc); font-size: 0.85rem; margin-bottom: 0.5rem; }
  .event-desc { color: var(--mute); font-size: 0.9rem; margin: 0; flex-grow: 1; }
  
  .status-msg { grid-column: 1 / -1; text-align: center; padding: 3rem; color: var(--mute); }
</style>
</head>
<body>

<header>
  <h1>Find something to do in Hamilton</h1>
  <p class="subtitle">Discover local events and activities</p>
</header>

<main>
  <div id="events-container">
    <div class="status-msg">Loading events...</div>
  </div>
</main>

<script>
  // 1. YOUR CLOUDFLARE WORKER URL
  const WORKER_URL = 'https://hamilton-events-proxy.quickpixelcanada.workers.dev/';
  
  // 2. THE WORKING RSS FEED
  const RSS_FEED_URL = 'https://www.thespec.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc&k%5B%5D=%23topstory';

  async function fetchEvents() {
    const container = document.getElementById('events-container');
    const proxyUrl = `${WORKER_URL}?rss=${encodeURIComponent(RSS_FEED_URL)}`;

    try {
      const response = await fetch(proxyUrl);
      if (!response.ok) throw new Error(`HTTP error: ${response.status}`);

      const xmlText = await response.text();
      const parser = new DOMParser();
      const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
      const items = xmlDoc.querySelectorAll('item');

      if (items.length === 0) {
        container.innerHTML = '<div class="status-msg">No events found right now.</div>';
        return;
      }

      container.innerHTML = ''; 

      items.forEach(item => {
        const title = item.querySelector('title')?.textContent || 'Untitled Event';
        const link = item.querySelector('link')?.textContent || '#';
        const description = item.querySelector('description')?.textContent || '';
        const pubDate = item.querySelector('pubDate')?.textContent || 'Date TBA';
        
        // Extract the image URL from the <enclosure> tag
        const enclosure = item.querySelector('enclosure');
        const imageUrl = enclosure ? enclosure.getAttribute('url') : '';

        // Format Date
        let formattedDate = pubDate;
        const d = new Date(pubDate);
        if (!isNaN(d)) {
          formattedDate = d.toLocaleDateString('en-CA', { 
            weekday: 'short', month: 'short', day: 'numeric' 
          });
        }

        const card = document.createElement('a');
        card.className = 'event-card';
        card.href = link;
        card.target = '_blank';
        card.rel = 'noopener noreferrer';
        
        card.innerHTML = `
          ${imageUrl ? `<img src="${imageUrl}" class="card-image" alt="${title}" loading="lazy">` : ''}
          <div class="card-content">
            <h3 class="event-title">${title}</h3>
            <div class="event-date">${formattedDate}</div>
            <p class="event-desc">${description}</p>
          </div>
        `;
        container.appendChild(card);
      });

    } catch (error) {
      console.error(error);
      container.innerHTML = `<div class="status-msg" style="color:red;">Failed to load events: ${error.message}</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', fetchEvents);
</script>
</body>
</html>
